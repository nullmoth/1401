[package]
name = "nullmoth-safe"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "OpenCore boot-picker tool: boot macOS once in Safe Mode with the NullMoth NVIDIA driver off"

[dependencies]
uefi = { version = "0.41.0", features = ["panic_handler", "logger", "alloc", "global_allocator"] }

[profile.release]
panic = "abort"
opt-level = "s"

[profile.dev]
panic = "abort"
